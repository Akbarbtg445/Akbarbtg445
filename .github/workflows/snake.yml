name: Generate Snake

on:
  schedule:
    # Otomatis berjalan setiap 12 jam
    - cron: "0 */12 * * *"
  # Memungkinkan Anda menjalankan action ini secara manual kapan saja
  workflow_dispatch:
  # Berjalan otomatis setiap ada push baru di branch main
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Mengambil data dari grafik kontribusi GitHub Anda
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Mengunggah hasil gambar cacing ke branch terpisah bernama 'output'
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
